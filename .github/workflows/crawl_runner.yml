name: Hourly Subscription Crawl

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      tiers:
        description: Risk tiers to scan, comma-separated
        required: false
        default: low,high
      page_size:
        description: Task page size
        required: false
        default: '100'

# 提前启用 Node.js 24 运行时，消除 Node.js 20 弃用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: hourly-subscription-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # pip 缓存加速依赖安装
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 验证 Chrome 环境（ubuntu-latest 预装）
      - name: Verify Chrome environment
        run: |
          google-chrome --version
          chromedriver --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler
        env:
          MONITOR_API_BASE_URL: ${{ secrets.MONITOR_API_BASE_URL }}
          MONITOR_API_CLIENT_ID: ${{ secrets.MONITOR_API_CLIENT_ID }}
          MONITOR_API_SECRET: ${{ secrets.MONITOR_API_SECRET }}
          MONITOR_TIERS: ${{ github.event.inputs.tiers || 'low,high' }}
          MONITOR_SOURCE_MODE: subscription
          MONITOR_RESULT_MODE: subscription
          MONITOR_PAGE_SIZE: ${{ github.event.inputs.page_size || '100' }}
          MAX_WORKERS: 12
        run: |
          python - <<'PY'
          from runner.main import crawl_one

          urls = [
              'https://tobaccolifestyle.com/collections/pipe-tobacco/products/cornell-diehl-briar-fox-2oz-56-7-gram-tin',
              'https://www.havahavana.com/products/germains-brown-flake-pipe-tobacco-50g-tin',
              'https://pipemoment.com/en/products/salty-dogs-50g',
          ]
          for url in urls:
              result = crawl_one({'url': url})
              print(result)
              if not result['fetch_ok']:
                  raise SystemExit(f'UCP smoke test failed: {result}')
          PY
