name: Daily Full Crawl

on:
  schedule:
    - cron: '20 2 * * *'
    - cron: '20 10 * * *'
    - cron: '20 18 * * *'
  workflow_dispatch:
    inputs:
      tiers:
        description: Risk tiers to scan, comma-separated
        required: false
        default: low,high
      page_size:
        description: Task page size
        required: false
        default: '100'
      shard:
        description: Shard to run (`all`, `0`, `1`, `2`)
        required: false
        default: all
        type: choice
        options:
          - all
          - '0'
          - '1'
          - '2'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: daily-full-crawl
  cancel-in-progress: false

jobs:
  crawl:
    name: Daily Full Crawl (shard ${{ matrix.shard_name }})
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == matrix.cron) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.shard == 'all' || github.event.inputs.shard == matrix.shard)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '0'
            shard_index: '0'
            shard_name: 1/3
            cron: '20 2 * * *'
          - shard: '1'
            shard_index: '1'
            shard_name: 2/3
            cron: '20 10 * * *'
          - shard: '2'
            shard_index: '2'
            shard_name: 3/3
            cron: '20 18 * * *'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Verify Chrome environment
        run: |
          google-chrome --version
          chromedriver --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full crawler
        env:
          MONITOR_API_BASE_URL: ${{ secrets.MONITOR_API_BASE_URL }}
          MONITOR_API_CLIENT_ID: ${{ secrets.MONITOR_API_CLIENT_ID }}
          MONITOR_API_SECRET: ${{ secrets.MONITOR_API_SECRET }}
          MONITOR_TIERS: ${{ github.event.inputs.tiers || 'low,high' }}
          MONITOR_SOURCE_MODE: catalog
          MONITOR_RESULT_MODE: catalog
          MONITOR_PAGE_SIZE: ${{ github.event.inputs.page_size || '100' }}
          MONITOR_REFRESH_ON_FIRST_PULL: ${{ (github.event_name == 'schedule' && 'true') || (github.event.inputs.shard != 'all' && 'true') || (matrix.shard == '0' && 'true') || 'false' }}
          MONITOR_SHARD_TOTAL: '3'
          MONITOR_SHARD_INDEX: ${{ matrix.shard_index }}
          MAX_WORKERS: 12
        run: python -m runner.main
