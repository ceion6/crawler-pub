name: Verify Monitor Connection

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install client dependencies
        run: python -m pip install -r requirements.txt
      - name: Read signed subscription pages
        env:
          MONITOR_API_BASE_URL: ${{ secrets.MONITOR_API_BASE_URL }}
          MONITOR_API_CLIENT_ID: ${{ secrets.MONITOR_API_CLIENT_ID }}
          MONITOR_API_SECRET: ${{ secrets.MONITOR_API_SECRET }}
        run: python -m runner.verify_monitor
